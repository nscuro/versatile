name: Integration Test

on:
  schedule:
  - cron: "0 4 * * *"
  workflow_dispatch: { }

permissions: { }

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      with:
        persist-credentials: false
        submodules: 'true'
    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # tag=v6.0.1
      with:
        java-version: 21
        distribution: "temurin"
        cache: "maven"
    - name: Integration Test
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: mvn -B test-compile failsafe:integration-test
    - name: Upload Integration Test Results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
      with:
        name: test-results
        path: versatile-core/target/results/*.json
